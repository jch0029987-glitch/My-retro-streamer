​[package]
name = "retro_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "retro_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.38", features = ["full", "rt-multi-thread"] }
bytes = "1.5"
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", optional = true }

[features]
default = []
host = []
client = []
