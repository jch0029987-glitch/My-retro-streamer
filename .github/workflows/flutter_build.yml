name: Build Flutter Host and Client APKs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-apks:
    name: Compile Rust & Build Flutter APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi

      - name: Install Cargo NDK
        run: cargo install cargo-ndk

      - name: Build Rust Engine for Both Targets
        run: |
          cd rust_engine
          cargo ndk -t aarch64-linux-android -p 26 build --release --features host
          cargo ndk -t armv7-linux-androideabi -p 21 build --release --features client

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Build Pixel 9 Host APK
        run: |
          mkdir -p retro_host_app/android/app/src/main/jniLibs/arm64-v8a
          cp rust_engine/target/aarch64-linux-android/release/libretro_engine.so retro_host_app/android/app/src/main/jniLibs/arm64-v8a/
          
          cd retro_host_app
          flutter pub get
          flutter build apk --release

      - name: Build ARMv7-A Client APK
        run: |
          mkdir -p retro_client_app/android/app/src/main/jniLibs/armeabi-v7a
          cp rust_engine/target/armv7-linux-androideabi/release/libretro_engine.so retro_client_app/android/app/src/main/jniLibs/armeabi-v7a/
          
          cd retro_client_app
          flutter pub get
          flutter build apk --release

      - name: Upload Release APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retro-streaming-apks
          path: |
            retro_host_app/build/app/outputs/flutter-apk/app-release.apk
            retro_client_app/build/app/outputs/flutter-apk/app-release.apk
