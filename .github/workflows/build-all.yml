name: Build All Native Binaries (Android 16 / arm64-v8a)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-natives:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK r28c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          local-cache: true

      - name: Configure Toolchain Environment
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          echo "CORE_CC=$TOOLCHAIN/aarch64-linux-android35-clang" >> $GITHUB_ENV
          echo "CORE_CXX=$TOOLCHAIN/aarch64-linux-android35-clang++" >> $GITHUB_ENV
          echo "CORE_AR=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
          echo "CORE_LD=$TOOLCHAIN/ld.lld" >> $GITHUB_ENV

      - name: Install Build Essentials, CMake & Ninja
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential

      - name: 1. Build Custom Stream Server (Ninja + NDK Toolchain)
        run: |
          mkdir -p build-server
          cd build-server
          cmake "$GITHUB_WORKSPACE/server" \
            -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM=android-35 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: 2. Build Genesis Plus GX Core (Sega)
        run: |
          mkdir -p cores
          git clone https://github.com/libretro/Genesis-Plus-GX.git cores/Genesis-Plus-GX
          cd cores/Genesis-Plus-GX
          make -f Makefile platform=unix CC="$CORE_CC" CXX="$CORE_CXX" AR="$CORE_AR" LD="$CORE_LD"

      - name: 3. Build PCSX ReArmed Core (PS1)
        run: |
          git clone https://github.com/libretro/pcsx_rearmed.git cores/pcsx_rearmed
          cd cores/pcsx_rearmed
          make -f Makefile.libretro platform=unix CC="$CORE_CC" CXX="$CORE_CXX" AR="$CORE_AR" LD="$CORE_LD" ARCH=arm64

      - name: 4. Organize Output Binaries
        run: |
          mkdir -p output_libs/arm64-v8a
          cp build-server/libstream_server.so output_libs/arm64-v8a/
          cp cores/Genesis-Plus-GX/genesis_plus_gx_libretro.so output_libs/arm64-v8a/
          cp cores/pcsx_rearmed/pcsx_rearmed_libretro.so output_libs/arm64-v8a/

      - name: Upload All Native Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-arm64-android16-libs
          path: output_libs/
