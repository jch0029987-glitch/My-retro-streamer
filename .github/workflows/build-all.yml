name: Build Host & Client Native Binaries

on:
  push:
    branches: [ "main" ]

jobs:
  build-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi

      - name: Install Cargo NDK
        run: cargo install cargo-ndk

      - name: Build Pixel 9 Host Binary (ARM64)
        run: |
          cd rust_engine
          cargo ndk -t aarch64-linux-android -p 26 build --release --features host

      - name: Build Client Binary (ARMv7-A)
        run: |
          cd rust_engine
          cargo ndk -t armv7-linux-androideabi -p 21 build --release --features client

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: all-native-libs
          path: |
            rust_engine/target/aarch64-linux-android/release/libretro_engine.so
            rust_engine/target/armv7-linux-androideabi/release/libretro_engine.so
