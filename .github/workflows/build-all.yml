name: Build Native Library

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v3
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Compile libclient_bridge.so
        run: |
          # Use the official NDK Clang compiler for 32-bit ARM Android API 24
          CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
          
          $CC -shared -fPIC client_bridge.c \
              -o libclient_bridge.so \
              -O3

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: armeabi-v7a-libs
          path: libclient_bridge.so
