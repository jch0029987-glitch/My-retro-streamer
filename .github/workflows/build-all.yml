name: Build Android Native Library

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: false

      - name: Build with Cargo NDK
        run: |
          cargo install cargo-ndk
          cd server
          cargo ndk -t armeabi-v7a --platform 34 -o ./jniLibs build --release

      - name: Verify Binary Architecture
        run: |
          cd server/jniLibs/armeabi-v7a
          file libclient_bridge.so
          readelf -h libclient_bridge.so | grep -E "Class|Machine"
          file libclient_bridge.so | grep -q "32-bit" || (echo "ERROR: Built library is not 32-bit!" && exit 1)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libclient_bridge-armeabi-v7a
          path: server/jniLibs/armeabi-v7a/libclient_bridge.so
