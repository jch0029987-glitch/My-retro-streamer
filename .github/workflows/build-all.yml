name: Build Android Native Library

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: false

      - name: Build with Cargo NDK
        run: |
          cargo install cargo-ndk
          cargo ndk --manifest-path server/Cargo.toml -t armeabi-v7a -p 34 build --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libclient_bridge-armeabi-v7a
          path: server/target/armv7-linux-androideabi/release/libclient_bridge.so
