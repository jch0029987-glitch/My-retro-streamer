name: Scaffold Flutter Project Structure

on:
  workflow_dispatch: # Trigger manually from the GitHub Actions tab

jobs:
  scaffold:
    name: Run Flutter Create
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows pushing the generated folders back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Create Flutter Host App
        run: |
          if [ ! -d "retro_host_app" ]; then
            flutter create retro_host_app --platforms android
          fi

      - name: Create Flutter Client App
        run: |
          if [ ! -d "retro_client_app" ]; then
            flutter create retro_client_app --platforms android
          fi

      - name: Commit and Push Generated Structure
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add retro_host_app/ retro_client_app/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: scaffold flutter host and client project structure via flutter create" && git push origin main)
